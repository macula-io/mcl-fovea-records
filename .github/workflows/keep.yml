# The keeper, by hand: the same run as the timer (keeper/keep.sh), on a
# self-hosted runner on a Macula lab machine in a runner group that serves
# only this repository (macula stations are IPv6-only and GitHub-hosted runners
# have no IPv6). The every-15-minutes run is a user timer on that machine
# (keeper/systemd/), because GitHub never fired this workflow's schedule;
# having one scheduler means two keepers never race on the same commits.
# Triggered only by hand, never by a pull request, so no fork can run code on
# that box. Its only credential is the job's own GITHUB_TOKEN, allowed to
# write this repository's contents.
name: keep

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep
  cancel-in-progress: false

jobs:
  keep:
    runs-on: [self-hosted, fovea-keeper]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner's docker shim puts the container under the runner's CPU
      # and memory ceiling.
      - name: keep
        run: RUNTIME=docker keeper/keep.sh
